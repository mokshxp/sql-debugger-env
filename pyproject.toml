[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sql-debugger-env"
version = "1.0.0"
description = "A real-world OpenEnv environment for SQL debugging and optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "openai>=1.35.3",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/moksh24/sql-debugger-env"
Repository = "https://github.com/mokshxp/sql-debugger-env"

[tool.openenv]
name = "sql-debugger"
version = "1.0.0"
entry_point = "app:app"
tasks = ["task_easy", "task_medium", "task_hard"]
